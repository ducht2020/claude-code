<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Poppins:wght@700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: '#090A14',
            primary: '#DF6B33',
            surface: '#12131F',
            surface2: '#1A1C2B',
            line: '#262839',
          },
          fontFamily: {
            heading: ['Poppins', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>

  <style>
    html, body { background-color: #090A14; }
    body { font-family: 'Inter', sans-serif; font-weight: 400; color-scheme: dark; }
    /* Autofill stays dark */
    input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 1000px #12131F inset;
      -webkit-text-fill-color: #e5e7eb;
      caret-color: #e5e7eb;
    }
    .glow {
      background: radial-gradient(60% 60% at 50% 50%, rgba(223,107,51,.22) 0%, rgba(223,107,51,0) 70%);
    }
  </style>
</head>

<body class="min-h-screen bg-bg text-gray-300 antialiased">
  <main class="relative min-h-screen flex items-center justify-center px-4 py-10 sm:px-6 overflow-hidden">
    <!-- Background glows -->
    <div class="glow pointer-events-none absolute -top-40 -left-40 h-[28rem] w-[28rem] rounded-full"></div>
    <div class="glow pointer-events-none absolute -bottom-48 -right-32 h-[32rem] w-[32rem] rounded-full"></div>

    <section class="relative w-full max-w-md md:max-w-lg">
      <!-- Logo -->
      <div class="flex flex-col items-center mb-8">
        <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-primary shadow-lg shadow-primary/30">
          <i data-lucide="log-in" class="h-7 w-7 text-white"></i>
        </div>
        <h1 class="mt-5 font-heading font-extrabold text-3xl sm:text-4xl text-white tracking-tight text-center">Welcome back</h1>
        <p class="mt-2 text-sm sm:text-base text-gray-400 text-center">Sign in to your account to continue</p>
      </div>

      <!-- Card -->
      <div class="rounded-2xl border border-line bg-surface/80 backdrop-blur p-6 sm:p-8 shadow-2xl shadow-black/40">
        <form id="login-form" class="space-y-5" novalidate>
          <!-- Email -->
          <div>
            <label for="email" class="mb-2 block text-sm text-gray-300">Email</label>
            <div class="relative">
              <i data-lucide="mail" class="pointer-events-none absolute left-3.5 top-1/2 h-5 w-5 -translate-y-1/2 text-gray-500"></i>
              <input
                id="email" name="email" type="email" autocomplete="email" required
                placeholder="you@example.com"
                class="w-full rounded-xl border border-line bg-surface2 py-3 pl-11 pr-4 text-sm sm:text-base text-gray-100 placeholder-gray-500 outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/30" />
            </div>
            <p id="email-error" class="mt-1.5 hidden text-xs text-red-400">Please enter a valid email address.</p>
          </div>

          <!-- Password -->
          <div>
            <label for="password" class="mb-2 block text-sm text-gray-300">Password</label>
            <div class="relative">
              <i data-lucide="lock" class="pointer-events-none absolute left-3.5 top-1/2 h-5 w-5 -translate-y-1/2 text-gray-500"></i>
              <input
                id="password" name="password" type="password" autocomplete="current-password" required minlength="6"
                placeholder="Enter your password"
                class="w-full rounded-xl border border-line bg-surface2 py-3 pl-11 pr-12 text-sm sm:text-base text-gray-100 placeholder-gray-500 outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/30" />
              <button type="button" id="toggle-password" aria-label="Show password"
                class="absolute right-2.5 top-1/2 -translate-y-1/2 rounded-lg p-1.5 text-gray-500 transition hover:text-gray-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50">
                <i data-lucide="eye" id="eye-icon" class="h-5 w-5"></i>
              </button>
            </div>
            <p id="password-error" class="mt-1.5 hidden text-xs text-red-400">Password must be at least 6 characters.</p>
          </div>

          <!-- Remember + Forgot -->
          <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <label class="inline-flex cursor-pointer select-none items-center gap-2.5 text-sm text-gray-300">
              <input id="remember" name="remember" type="checkbox"
                class="h-4 w-4 cursor-pointer rounded border-line bg-surface2 accent-primary focus:ring-2 focus:ring-primary/40" />
              Remember me
            </label>
            <a href="#" class="text-sm text-primary transition hover:text-[#f08a55] hover:underline">Forgot password?</a>
          </div>

          <!-- Submit -->
          <button type="submit"
            class="group flex w-full items-center justify-center gap-2 rounded-xl bg-primary px-4 py-3 font-heading text-base font-bold text-white shadow-lg shadow-primary/25 transition hover:brightness-110 active:scale-[0.99] focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/60 focus-visible:ring-offset-2 focus-visible:ring-offset-bg">
            Sign in
            <i data-lucide="arrow-right" class="h-5 w-5 transition group-hover:translate-x-0.5"></i>
          </button>
        </form>

        <!-- Divider -->
        <div class="my-6 flex items-center gap-4">
          <div class="h-px flex-1 bg-line"></div>
          <span class="text-xs uppercase tracking-wider text-gray-500">Or continue with</span>
          <div class="h-px flex-1 bg-line"></div>
        </div>

        <!-- Social -->
        <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
          <button type="button"
            class="flex items-center justify-center gap-2.5 rounded-xl border border-line bg-surface2 px-4 py-3 text-sm text-gray-200 transition hover:border-gray-500 hover:bg-[#20223a] focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50">
            <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.6 3.9-5.5 3.9-3.3 0-6-2.7-6-6s2.7-6 6-6c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3.4 14.6 2.4 12 2.4 6.7 2.4 2.4 6.7 2.4 12s4.3 9.6 9.6 9.6c5.5 0 9.2-3.9 9.2-9.4 0-.6-.1-1.1-.2-1.6H12z"/>
            </svg>
            <span>Google</span>
          </button>

          <button type="button"
            class="flex items-center justify-center gap-2.5 rounded-xl border border-line bg-surface2 px-4 py-3 text-sm text-gray-200 transition hover:border-gray-500 hover:bg-[#20223a] focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50">
            <i data-lucide="github" class="h-5 w-5"></i>
            <span>GitHub</span>
          </button>

          <button type="button"
            class="flex items-center justify-center gap-2.5 rounded-xl border border-line bg-surface2 px-4 py-3 text-sm text-gray-200 transition hover:border-gray-500 hover:bg-[#20223a] focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50">
            <i data-lucide="facebook" class="h-5 w-5 text-[#1877F2]"></i>
            <span>Facebook</span>
          </button>
        </div>
      </div>

      <p class="mt-6 text-center text-sm text-gray-400">
        Don't have an account?
        <a href="#" class="text-primary transition hover:underline">Create one</a>
      </p>
    </section>
  </main>

  <script>
    lucide.createIcons();

    const form = document.getElementById('login-form');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const emailError = document.getElementById('email-error');
    const passwordError = document.getElementById('password-error');
    const toggle = document.getElementById('toggle-password');

    toggle.addEventListener('click', () => {
      const show = password.type === 'password';
      password.type = show ? 'text' : 'password';
      toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      toggle.innerHTML = '<i data-lucide="' + (show ? 'eye-off' : 'eye') + '" class="h-5 w-5"></i>';
      lucide.createIcons();
    });

    function setError(input, el, invalid) {
      el.classList.toggle('hidden', !invalid);
      input.classList.toggle('border-red-500', invalid);
      input.classList.toggle('border-line', !invalid);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
      const passOk = password.value.length >= 6;
      setError(email, emailError, !emailOk);
      setError(password, passwordError, !passOk);
      if (emailOk && passOk) {
        // TODO: connect to your authentication API here
        console.log('Login submitted', {
          email: email.value.trim(),
          remember: document.getElementById('remember').checked,
        });
      }
    });
  </script>
</body>
</html>
